server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: gym-saas
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/gym_saas?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:gym_app}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      transaction-isolation: TRANSACTION_REPEATABLE_READ
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    parser:
      strict-duplicate-detection: true

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    dev:
      enabled: ${DEV_AUTH_ENABLED:false}
      key: ${DEV_AUTH_KEY:}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    phone-cipher-key: ${PHONE_CIPHER_KEY:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# Do not expose the incomplete API catalog as if all documented business routes were implemented.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
