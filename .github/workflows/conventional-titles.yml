name: Conventional Titles

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: conventional-titles-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  conventional-titles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check PR and commit subjects
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^[:space:]]'
          number=$(jq -r '.number' "$GITHUB_EVENT_PATH")
          head=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          endpoint="repos/$GITHUB_REPOSITORY/pulls/$number"
          pr=$(gh api "$endpoint")
          if [[ $(jq -r '.head.sha' <<< "$pr") != "$head" ]]; then
            echo 'A newer PR head superseded this run.'
            exit 0
          fi
          title=$(jq -r '.title' <<< "$pr")

          result=0
          if [[ ! $title =~ $pattern ]]; then
            echo '::error::PR title must use type: subject or type(scope): subject; use an ASCII colon.'
            result=1
          fi

          commits=$(gh api --paginate --slurp "$endpoint/commits?per_page=100")
          if [[ $(jq 'map(length) | add // 0' <<< "$commits") != $(jq -r '.commits' <<< "$pr") ]]; then
            # shortcut: REST lists at most 250 PR commits; split large PRs or switch to another commit source.
            echo '::error::Incomplete commit list. Rerun after synchronization or split the PR.'
            exit 1
          fi

          while IFS= read -r commit; do
            sha=$(jq -r '.sha' <<< "$commit")
            subject=$(jq -r '.commit.message | split("\n")[0]' <<< "$commit")
            if [[ ! $subject =~ $pattern ]]; then
              echo "::error::Commit ${sha:0:12} must use type: subject or type(scope): subject."
              result=1
            fi
          done < <(jq -c '.[][] | select((.parents | length) < 2)' <<< "$commits")
          exit "$result"
